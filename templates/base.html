<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory Usage Check</title>
    
    <!-- Add Bootstrap CSS if it isn't already inside your styles.css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  </head>
  
  <!-- Added Flexbox classes to body so mt-auto pushes the footer to the bottom -->
  <body class="d-flex flex-column min-vh-100">
    <div class="page-bg"></div>
    
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
    
    <footer class="bg-dark text-light py-3 mt-auto">
        <div class="container text-center">
            <p class="mb-1">
                <a href="https://devon-gs.github.io/" class="text-light text-decoration-none" title="coded by" target="_blank">
                    Coded by Devon - Redfire IT Solutions © <span id="year"></span>
                </a>
            </p>
            <p class="mb-0 small">
                <a href="https://www.flaticon.com/free-icons/stock" class="text-light text-decoration-none opacity-75" title="stock icons" target="_blank">
                    Icons created by Hilmy Abiyyu A. - Flaticon
                </a>
            </p>
        </div>
    </footer>
  </body>
</html>
